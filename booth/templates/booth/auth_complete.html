<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signed in · Photobooth</title>
</head>
<body>
    <p>Signed in successfully. You can return to Photobooth.</p>
    <script>
        if (window.opener && !window.opener.closed) {
            window.opener.postMessage({type: 'photobooth-account-ready'}, window.location.origin);
            window.close();
        } else {
            window.location.replace('/');
        }
    </script>
</body>
</html>
