<div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
    {% if field.errors %}<div class="errors">{{ field.errors|join:" " }}</div>{% endif %}
</div>
